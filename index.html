<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMUVA Rollouts</title>
<meta name="description" content="Rollout videos for CAMUVA (anonymous submission).">
<link rel="stylesheet" href="https://camx-anonymous.github.io/site.css">
<style>
/* page-specific: the shared chrome (tokens, header, chips, cards, footer) comes from site.css on the CAMX site */
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card .vid{aspect-ratio:16/9}
.card .vid video{cursor:pointer}
.empty{color:var(--ink3);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:8px;background:var(--chipbg)}
</style>
</head>
<body>
<nav class="site-switch" aria-label="Switch site"><span class="lbl">Sites</span>
  <a href="https://camx-anonymous.github.io/">CAMX Dataset</a>
  <a href="https://camx-anonymous.github.io/camuva-rollouts/" aria-current="page">CAMUVA Rollouts</a>
</nav>
<header><div class="wrap">
  <h1>CAMUVA Rollouts <small>policy rollout videos</small></h1>
  <p class="sub">Anonymous Authors · Under Review · real-robot rollouts of CAMUVA policies; each clip is one episode, unedited</p>
  <nav class="links">
    <a href="#">Paper (coming soon)</a>
    <a href="https://camx-anonymous.github.io/">CAMX Dataset</a>
    <a href="https://github.com/camx-anonymous/camuva-rollouts">Code</a>
    <a href="videos.json">videos.json</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="toolbar" id="filter"></div>
  <div class="grid" id="grid"><p class="empty">Loading…</p></div>
  <footer>This page is anonymized for review. <span id="footInfo"></span></footer>
</main>
<script>
// videos.json: [{ "src": "videos/x.mp4", "poster": "posters/x.jpg", "title": "...", "task": "...", "note": "..." }]
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('videos.json').then(r=>r.json()).then(list=>{
  const grid=document.getElementById('grid'),filter=document.getElementById('filter');
  if(!list.length){grid.innerHTML='<p class="empty">No rollout videos yet.</p>';return;}
  const tasks=[...new Set(list.map(v=>v.task).filter(Boolean))];
  const cnt=t=>list.filter(v=>v.task===t).length;
  document.getElementById('footInfo').textContent=`${list.length} rollouts`+(tasks.length?` across ${tasks.length} tasks`:'');
  const render=t=>{
    grid.innerHTML='';
    list.filter(v=>t==='all'||v.task===t).forEach(v=>{
      const c=document.createElement('div');c.className='card';
      c.innerHTML=`<div class="vid"><video src="${esc(v.src)}"${v.poster?` poster="${esc(v.poster)}"`:''} muted loop playsinline controls preload="metadata"></video></div>
        <div class="title">${esc(v.title||'')}</div>
        <div class="meta">${v.task?`<div><span class="k">Task</span> ${esc(v.task)}</div>`:''}${v.note?`<div>${esc(v.note)}</div>`:''}</div>`;
      grid.appendChild(c);
    });
    filter.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  };
  if(tasks.length>1){
    filter.innerHTML=`<span class="k">Task</span> <span class="chip btn" data-t="all">all<span class="c">${list.length}</span></span>`
      +tasks.map(t=>`<span class="chip btn" data-t="${esc(t)}">${esc(t)}<span class="c">${cnt(t)}</span></span>`).join('');
    filter.querySelectorAll('.chip').forEach(b=>b.onclick=()=>render(b.dataset.t));
  }
  render('all');
}).catch(()=>{document.getElementById('grid').innerHTML='<p class="empty">Could not load videos.json.</p>';});
</script>
</body>
</html>
